name: Versão

# Numa tag vX.Y.Z: testa, monta os pacotes, publica a versão e a imagem Docker.
# Precisa do segredo FIN_CHAVE_ATUALIZACAO, a chave privada que assina a atualização pela tela.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, curl, sodium
          coverage: none
      - run: echo "FIN_DADOS=$RUNNER_TEMP/financeiro" >> "$GITHUB_ENV"
      - run: php database/instalar.php --demo
      - run: php tests/run.php

  pacotes:
    needs: testes
    runs-on: ubuntu-24.04
    # o ambiente "versao" pode exigir a aprovação do dono antes de a chave assinar (docs/LANCAR-VERSAO.md)
    environment: versao
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.4'
          extensions: sodium
          coverage: none
      - name: A tag bate com o arquivo VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - run: sudo apt-get update && sudo apt-get install -y nsis p7zip-full gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 osslsigncode
      - name: Montar
        env:
          FIN_CHAVE_ATUALIZACAO: ${{ secrets.FIN_CHAVE_ATUALIZACAO }}
          FIN_WIN_PFX: ${{ secrets.FIN_WIN_PFX }}
          FIN_WIN_SENHA: ${{ secrets.FIN_WIN_SENHA }}
        run: |
          test -n "$FIN_CHAVE_ATUALIZACAO"
          packaging/empacotar.sh --saida "$RUNNER_TEMP/versao"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pacotes
          path: ${{ runner.temp }}/versao/*
          if-no-files-found: error

  # o .dmg só sai num Mac. Sem os segredos, sai sem Developer ID, e o Mac avisa ao abrir
  mac:
    needs: pacotes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: pacotes
          path: pacotes
      - name: Certificado, se houver
        env:
          FIN_MAC_P12: ${{ secrets.FIN_MAC_P12 }}
          FIN_MAC_P12_SENHA: ${{ secrets.FIN_MAC_P12_SENHA }}
          FIN_MAC_ID: ${{ secrets.FIN_MAC_ID }}
        run: |
          [ -n "$FIN_MAC_P12" ] || exit 0
          echo "$FIN_MAC_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          K="$RUNNER_TEMP/assinar.keychain-db"
          security create-keychain -p financeiro "$K"
          security set-keychain-settings -lut 21600 "$K"
          security unlock-keychain -p financeiro "$K"
          security import "$RUNNER_TEMP/cert.p12" -k "$K" -P "$FIN_MAC_P12_SENHA" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k financeiro "$K" > /dev/null
          security list-keychains -d user -s "$K"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Montar o .dmg
        env:
          FIN_MAC_ID: ${{ secrets.FIN_MAC_ID }}
          FIN_MAC_APPLE_ID: ${{ secrets.FIN_MAC_APPLE_ID }}
          FIN_MAC_SENHA: ${{ secrets.FIN_MAC_SENHA }}
          FIN_MAC_TIME: ${{ secrets.FIN_MAC_TIME }}
        run: packaging/macos/montar.sh --app-tar pacotes/financeiro-app-*.tar.gz --saida saida
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dmg
          path: saida/*.dmg
          if-no-files-found: error

  publicar:
    needs: [pacotes, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: baixado
      - name: Juntar e somar
        run: |
          mkdir versao
          mv baixado/pacotes/* baixado/dmg/* versao/
          cd versao
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- > SHA256SUMS
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 { d = 1; next } /^## / { d = 0 } d' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          gh release create "$GITHUB_REF_NAME" versao/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notas.md"

  imagem:
    needs: testes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: nome
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.nome.outputs.repo }}:${{ github.ref_name }}
            ghcr.io/${{ steps.nome.outputs.repo }}:latest
