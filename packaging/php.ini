; php.ini levado junto com o programa, para nada depender do PHP da máquina.
; session.save_path, error_log e a pasta de dados são definidos pelo app na partida (src/bootstrap.php).
display_errors=0
log_errors=1
expose_php=0
memory_limit=256M
upload_max_filesize=4M
post_max_size=8M
session.upload_progress.enabled=0
session.gc_probability=1
session.gc_divisor=100
opcache.enable=1
; no Windows: extension_dir=ext e extension=pdo_sqlite
